apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: fastapi

  template:
    metadata:
      labels:
        app: fastapi

    spec:
      containers:
        - name: fastapi
          image: pallakki/fastapi-demo:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000